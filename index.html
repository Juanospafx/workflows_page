<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brigtronix - Automation Hub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Main App Section -->
    <div id="app-section" class="vh-100 d-flex flex-column">
        <!-- Header -->
        <header class="bg-white border-bottom py-2 px-4 d-flex justify-content-between align-items-center">
            <div class="fw-bold fs-5">Brigtronix</div>
            <div class="text-muted small">Workflows Page</div>
            <div class="d-flex align-items-center gap-3">\n                <span class="badge bg-secondary rounded-pill">Brigtronix</span>\n            </div>
        </header>

        <div class="d-flex flex-grow-1 overflow-hidden">
            <!-- Sidebar -->
            <aside class="bg-light border-end p-3" style="width: 280px; overflow-y: auto;">
                <h6 class="text-uppercase text-muted small fw-bold mb-3">Select workflow</h6>
                <div class="list-group" id="workflow-list">
                    <!-- Workflows will be injected here -->
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-grow-1 p-5 overflow-y-auto bg-light-subtle">
                <div id="workflow-content" class="bg-white p-5 rounded shadow-sm h-100 d-flex flex-column justify-content-center align-items-center text-center d-none">
                    <h2 id="wf-title" class="mb-3">Workflow Title</h2>
                    <p id="wf-description" class="text-muted mb-5">Description goes here.</p>

                    <div class="mb-4 w-100" style="max-width: 500px;">
                        <label for="file-upload" class="form-label fw-bold">Subir archivo para procesar</label>
                        <!-- ???? Aqu?? est?? la modificaci??n: a??ad?? `multiple` -->
                        <input
                            class="form-control form-control-lg"
                            type="file"
                            id="file-upload"
                            multiple
                        >
                    </div>

                    <button id="run-workflow-btn" class="btn btn-primary btn-lg px-5 mb-4">
                        <span id="btn-text">Ejecutar workflow</span>
                        <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>

                    <div id="status-area" class="mt-3 w-100" style="max-width: 600px;">
                        <!-- Status messages and results will appear here -->
                    </div>
                </div>
                
                <div id="empty-state" class="h-100 d-flex justify-content-center align-items-center text-muted">
                    <p>Selecciona un workflow del men?? lateral para comenzar.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
</body>
</html>
