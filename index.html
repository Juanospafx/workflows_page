<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brigtronix - Automation Hub</title>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Main App Section -->
    <!-- This div is kept for JS compatibility (show/hide app). The new CSS makes the body a flex container. -->
    <div id="app-section" class="d-flex flex-grow-1">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="logo-container">
                    <img src="css/logo-text.png" alt="Brigtronix" class="logo-full">
                    <div class="app-subtitle">Automation Hub</div>
                </div>
                <h2 style="margin-top: 2rem;">Workflows</h2>
                <div class="list-group" id="workflow-list">
                    <!-- Workflows will be injected here -->
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <header class="top-bar">
                    <h1>Choose a Workflow</h1>
                    <div class="d-flex align-items-center gap-3">
                        <span class="badge bg-secondary rounded-pill">Brigtronix</span>
                    </div>
                </header>

                <div class="workspace">
                    <div id="workflow-content" class="card-box p-5 text-center d-none" style="margin: auto; max-width: 700px;">
                        <h1 id="wf-title" style="font-size: 1.75rem; letter-spacing: -0.03em;">Workflow Title</h1>
                        <p id="wf-description" class="text-secondary mb-5">Description goes here.</p>

                        <div class="mb-4 w-100 mx-auto" style="max-width: 500px;">
                            <label class="input-label">Upload file(s) to process</label>
                            <div id="drop-zone" class="drop-zone">
                                <i class="fa-solid fa-cloud-arrow-up fs-2 mb-2 text-muted"></i>
                                <p class="mb-1 fw-bold" style="font-size: 0.9rem;">Drag & Drop files here</p>
                                <p class="small text-secondary mb-0">or click to browse</p>
                                <input type="file" id="file-upload" multiple style="display: none;">
                            </div>
                            <div id="file-list-display" class="mt-3 text-start"></div>
                        </div>

                        <button id="run-workflow-btn" class="btn btn-primary btn-lg px-5 mb-4">
                            <span id="btn-text">Run Workflow</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>

                        <div id="status-area" class="mt-3 w-100 mx-auto" style="max-width: 600px;">
                            <!-- Status messages and results will appear here -->
                        </div>
                    </div>
                    
                    <div id="empty-state" class="h-100 d-flex justify-content-center align-items-center">
                        <p style="font-size: 1.2rem; color: var(--text-muted);">Select a workflow from the sidebar to start.</p>
                    </div>
                </div>
            </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
</body>
</html>
